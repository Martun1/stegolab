name: CI
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Embed → detect → extract round-trip (Linux)
        if: runner.os == 'Linux'
        run: |
          ./build/stegolab --quiet --no-color embed samples/cover.bmp -m "ci secret 7319" -o /tmp/s.bmp -p pw
          ./build/stegolab --quiet --no-color extract /tmp/s.bmp -p pw | grep -q "ci secret 7319"
